# Customers Platform - production stack for the VPS
#   docker compose up -d --build
# Website: http://YOUR_SERVER_IP:1100
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: customers
      POSTGRES_USER: customers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # tuned for a 2 vCPU / 8 GB VPS (Hostinger KVM 2)
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=4GB
      -c work_mem=64MB
      -c maintenance_work_mem=512MB
      -c max_wal_size=4GB
      -c max_parallel_workers_per_gather=2
      -c random_page_cost=1.1
    # only reachable from the VPS itself (use an SSH tunnel for pgAdmin / DBeaver)
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customers -d customers"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://customers:${POSTGRES_PASSWORD}@db:5432/customers
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
      TOKEN_HOURS: ${TOKEN_HOURS:-12}
    volumes:
      - appdata:/data          # logo, temporary uploads
    ports:
      - "${APP_PORT:-1100}:1100"

volumes:
  pgdata:
  appdata:
